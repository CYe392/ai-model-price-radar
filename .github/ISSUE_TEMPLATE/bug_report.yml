name: Bug report
description: Report a reproducible product, data, or accessibility problem without including secrets.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include provider credentials, personal data, confidential prompts, exported workspace files, or exploit details. Follow SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Product version
      placeholder: v2.0.0
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Page or API route
      placeholder: /, /status, or /api/v1/compare
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: input
    id: request
    attributes:
      label: Redacted x-request-id (optional)
